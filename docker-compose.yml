# Local, all free:
#   docker compose up -d falkordb                       # just the database (run api/web on the host for development)
#   docker compose --profile seed run --rm seed         # build both demo graphs from the committed snapshot (offline)
#   docker compose up -d --build                        # database + api (:8000) + web (:3001)
# The public deployment uses deploy/docker-compose.prod.yml (HTTPS, no database port published).
services:
  falkordb:
    image: falkordb/falkordb:v4.14.10
    ports:
      - "6379:6379"
      - "3000:3000"   # FalkorDB browser UI: inspect the graph yourself
    volumes:
      - falkor_data:/var/lib/falkordb/data

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      FALKOR_HOST: falkordb
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}   # optional: free-tier key; without it the offline router answers
    depends_on:
      - falkordb
    ports:
      - "8000:8000"

  web:
    build:
      context: ./web
      args:
        NEXT_PUBLIC_API: http://localhost:8000
    depends_on:
      - api
    ports:
      - "3001:3001"

  seed:
    profiles: ["seed"]
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: ["python", "-m", "blastradius.build"]
    environment:
      FALKOR_HOST: falkordb
    depends_on:
      - falkordb

volumes:
  falkor_data:
